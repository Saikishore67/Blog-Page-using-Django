{% extends 'blog/auth_base.html' %}
{% block content %}

<h2>My Posts</h2>
<hr>

{% for post in posts %}
    <div>
        <h3>{{ post.title }}</h3>
        <p>{{ post.content }}</p>
        <a href="{% url 'edit_post' post.id %}">Edit</a> |
        <a href="{% url 'delete_post' post.id %}">Delete</a>
        <hr>
    </div>
{% empty %}
    <p>You haven't created any posts yet.</p>
{% endfor %}

{% endblock %}
