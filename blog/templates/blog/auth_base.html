<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Auth{% endblock %}</title>

    {% load static %}
    <link rel="stylesheet" href="{% static 'blog/style.css' %}">
</head>

<header>
    <h1>Blog</h1>
    <nav>
        {% if user.is_authenticated %} 
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'add_post' %}">Add Post</a>
            <a href="{% url 'logout' %}">Logout</a>
            
            <span>Logged in as: 
                <a href="{% url 'account' %}">
                    {{ user.username }}
                </a>
            </span>
        {% endif %}
    </nav>

</header>

<body>

<div class="container">
    {% block content %}
    {% endblock %}
</div>

</body>
</html>
